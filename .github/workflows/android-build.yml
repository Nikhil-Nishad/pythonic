name: Build Modern Snake — Android APK & AAB

on:
  push:
    branches: [main, master]
    paths:
      - 'snake-app/**'
      - '.github/workflows/android-build.yml'
  workflow_dispatch: # Allow manual trigger

jobs:
  build-android:
    name: Build & Sign Android App
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # ────────────────────────────────────────────────
      # 1. Checkout source
      # ────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ────────────────────────────────────────────────
      # 2. Setup Java 17 (required by Gradle + Android)
      # ────────────────────────────────────────────────
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # ────────────────────────────────────────────────
      # 3. Setup Node.js and pnpm
      # ────────────────────────────────────────────────
      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9
          run_install: false

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_OUTPUT

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      # ────────────────────────────────────────────────
      # 4. Install Capacitor dependencies
      # ────────────────────────────────────────────────
      - name: Install Capacitor dependencies
        working-directory: snake-app
        run: pnpm install

      # ────────────────────────────────────────────────
      # 5. Initialize Capacitor & add Android platform
      # ────────────────────────────────────────────────
      - name: Initialize Capacitor (if not already initialized)
        working-directory: snake-app
        run: |
          if [ ! -f "capacitor.config.json" ]; then
            npx cap init "Modern Snake" "com.nikhilnishad.modernsnake" --web-dir .
          fi

      - name: Add Android platform (if android/ not present)
        working-directory: snake-app
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi

      # ────────────────────────────────────────────────
      # 6. Sync web assets into Android project
      # ────────────────────────────────────────────────
      - name: Sync Capacitor assets
        working-directory: snake-app
        run: npx cap sync android

      # ────────────────────────────────────────────────
      # 7. Setup Android SDK
      # ────────────────────────────────────────────────
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # ────────────────────────────────────────────────
      # 8. Cache Gradle dependencies
      # ────────────────────────────────────────────────
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # ────────────────────────────────────────────────
      # 9. Make Gradle wrapper executable
      # ────────────────────────────────────────────────
      - name: Make gradlew executable
        working-directory: snake-app/android
        run: chmod +x gradlew

      # ────────────────────────────────────────────────
      # 10. Check if keystore secret is present
      # (secrets context cannot be used in if: expressions,
      #  so we resolve it once here and use the output below)
      # ────────────────────────────────────────────────
      - name: Check keystore availability
        id: check-keystore
        env:
          _KS: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$_KS" ]; then
            echo "has_keystore=true" >> $GITHUB_OUTPUT
          else
            echo "has_keystore=false" >> $GITHUB_OUTPUT
          fi

      # ────────────────────────────────────────────────
      # 11. Build Debug APK (always, for testing)
      # ────────────────────────────────────────────────
      - name: Build Debug APK
        working-directory: snake-app/android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      # ────────────────────────────────────────────────
      # 12. Build Release AAB (signed, for Play Store)
      # ────────────────────────────────────────────────
      - name: Decode Keystore from Secret
        if: steps.check-keystore.outputs.has_keystore == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > snake-app/android/app/release-key.jks

      - name: Build Release AAB (signed)
        if: steps.check-keystore.outputs.has_keystore == 'true'
        working-directory: snake-app/android
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/snake-app/android/app/release-key.jks
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASS: ${{ secrets.KEY_PASS }}
        run: |
          ./gradlew bundleRelease \
            -Pandroid.injected.signing.store.file="$KEYSTORE_PATH" \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASS" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASS" \
            --no-daemon

      - name: Build Unsigned Release APK (fallback when no keystore)
        if: steps.check-keystore.outputs.has_keystore == 'false'
        working-directory: snake-app/android
        run: ./gradlew assembleRelease --no-daemon

      # ────────────────────────────────────────────────
      # 12. Upload artifacts
      # ────────────────────────────────────────────────
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: modern-snake-debug-apk
          path: snake-app/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload Release AAB
        if: steps.check-keystore.outputs.has_keystore == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: modern-snake-release-aab
          path: snake-app/android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: warn

      - name: Upload Release APK (unsigned)
        if: steps.check-keystore.outputs.has_keystore == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: modern-snake-release-unsigned-apk
          path: snake-app/android/app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: warn

      # ────────────────────────────────────────────────
      # 13. Build Summary
      # ────────────────────────────────────────────────
      - name: Build Summary
        run: |
          echo "## 🐍 Modern Snake — Android Build Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Artifact | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Debug APK | ✅ Built |" >> $GITHUB_STEP_SUMMARY
          echo "| Release AAB | ${{ secrets.KEYSTORE_BASE64 != '' && '✅ Signed' || '⚠️ No keystore configured' }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Download the APK from the **Artifacts** section above." >> $GITHUB_STEP_SUMMARY
